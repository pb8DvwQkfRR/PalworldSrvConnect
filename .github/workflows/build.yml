name: Build PalworldSrvConnect

on:
  workflow_dispatch:
  push:
    paths:
      - "PalworldSrvConnect/**"
      - "CMakeLists.txt"
      - "setup.ps1"
      - "build.bat"
      - "build.ps1"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build UE4SS mod
        shell: powershell
        env:
          UEPSEUDO_TOKEN: ${{ secrets.UEPSEUDO_TOKEN }}
        run: ./build.ps1

      - name: Upload installable mod
        uses: actions/upload-artifact@v4
        with:
          name: PalworldSrvConnect
          path: dist/PalworldSrvConnect
