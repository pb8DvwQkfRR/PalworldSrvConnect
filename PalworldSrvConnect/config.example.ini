[SRV]
; Version 0.1.2 uses the conventional owner below automatically when the
; hostname is entered without an explicit port:
; _palworld._udp.<the hostname entered in Palworld>
;
; This file is documentation for server operators. Runtime configuration is
; intentionally not enabled in v0.1.2 so every client uses identical behavior.
Service=_palworld
Protocol=_udp
